<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Detail — Thinking Animation Demo</title>
<link rel="icon" href="../../assets/favicon-v2.png">
<link rel="stylesheet" href="../../colors_and_type.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body { font-family: var(--font-sans); font-variant-numeric: lining-nums tabular-nums; background: #F4F1ED; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(26,26,26,0.10); border-radius: 99px; }
  button { font-family: inherit; }
  input { font-family: inherit; }

  /* Thinking dots */
  @keyframes thinkingDot {
    0%, 100% { opacity: 0.25; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .thinking-dot { animation: thinkingDot 1.2s ease-in-out infinite; }

  /* Icon sweep */
  @keyframes thinkingSweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  .thinking-icon-sweep { animation: thinkingSweep 1.8s ease-in-out infinite; }

  /* Icon ring pulse */
  @keyframes thinkingIconRing {
    0%, 100% { border-color: rgba(212,163,115,0.3); }
    50% { border-color: rgba(212,163,115,0.8); }
  }
  .thinking-icon-ring { animation: thinkingIconRing 2s ease-in-out infinite; }

  /* Shimmer bars */
  @keyframes shimmer {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(250%); }
  }
  .thinking-bar-shimmer { animation: shimmer 1.5s ease-in-out infinite; }

  /* Cursor blink */
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .stream-cursor { animation: cursorBlink 0.6s ease-in-out infinite; }

  /* Spin */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  /* Button press */
  button { transition: transform 0.12s ease, background 0.2s ease; }
  button:active { transform: scale(0.97); }

  [data-clickable]:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="SharedComponents.jsx"></script>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

/* ── Thinking Animation ── */

function ThinkingDots() {
  const primary = '#D4A373';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 0' }}>
      {Array.from({ length: 5 }).map((_, i) => (
        <div key={i} className="thinking-dot" style={{
          width: 10, height: 10, borderRadius: '50%',
          background: primary, animationDelay: `${i * 0.15}s`,
        }} />
      ))}
    </div>
  );
}

function ThinkingBlock() {
  const primary = '#D4A373';
  const [elapsed, setElapsed] = useState(0);

  useEffect(() => {
    const timer = setInterval(() => setElapsed(e => e + 1), 1000);
    return () => clearInterval(timer);
  }, []);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
          <ThinkingDots />
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
            letterSpacing: '0.12em', color: 'rgba(26,26,26,0.40)',
          }}>思考中 · {elapsed}s</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {[75, 55, 40].map((w, i) => (
            <div key={i} style={{
              height: 12, borderRadius: 6, width: `${w}%`,
              background: 'rgba(26,26,26,0.04)', overflow: 'hidden', position: 'relative',
            }}>
              <div className="thinking-bar-shimmer" style={{
                position: 'absolute', inset: 0,
                background: `linear-gradient(90deg, transparent, rgba(212,163,115,0.14), transparent)`,
                animationDelay: `${i * 0.3}s`,
              }} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── Streaming text ── */

function StreamingText({ text, onDone }) {
  const [displayed, setDisplayed] = useState('');
  const [done, setDone] = useState(false);
  const idx = useRef(0);

  useEffect(() => {
    idx.current = 0; setDisplayed(''); setDone(false);
    const interval = setInterval(() => {
      idx.current += Math.floor(Math.random() * 3) + 1;
      if (idx.current >= text.length) {
        idx.current = text.length;
        setDisplayed(text); setDone(true);
        clearInterval(interval); onDone && onDone();
      } else {
        setDisplayed(text.slice(0, idx.current));
      }
    }, 25);
    return () => clearInterval(interval);
  }, [text]);

  return (
    <span>
      {displayed}
      {!done && <span className="stream-cursor" style={{
        display: 'inline-block', width: 2, height: '1.1em',
        background: 'currentColor', marginLeft: 1,
        verticalAlign: 'text-bottom', opacity: 0.6,
      }} />}
    </span>
  );
}

/* ── Messages ── */

function MessageBubble({ msg, isStreaming }) {
  const primary = '#D4A373';
  const text = '#1A1A1A';
  const isUser = msg.role === 'user';

  if (isUser) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
        <div style={{
          maxWidth: '70%', padding: '14px 20px', borderRadius: '18px 18px 4px 18px',
          background: 'rgba(212,163,115,0.10)',
          border: '1px solid rgba(212,163,115,0.20)',
          color: text, fontSize: 13, lineHeight: 1.6, fontWeight: 500,
        }}>{msg.content}</div>
        <span style={{
          fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
          letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)',
        }}>User · {msg.time}</span>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, lineHeight: 1.75, color: 'rgba(26,26,26,0.80)', maxWidth: 560 }}>
          {isStreaming
            ? <StreamingText text={msg.content} />
            : msg.content.split('\n').map((line, i) => {
                const bold = line.match(/\*\*(.+?)\*\*/g);
                if (bold) {
                  const parts = line.split(/\*\*(.+?)\*\*/);
                  return <div key={i} style={{ marginBottom: 4 }}>{parts.map((p, j) =>
                    j % 2 === 1 ? <strong key={j} style={{ fontWeight: 700, color: text }}>{p}</strong> : p
                  )}</div>;
                }
                return line ? <div key={i} style={{ marginBottom: 4 }}>{line}</div> : <div key={i} style={{ height: 8 }} />;
              })
          }
        </div>
        {msg.sources && !isStreaming && (
          <div style={{
            marginTop: 12, padding: '10px 14px', borderRadius: 12,
            background: 'rgba(244,241,237,0.50)',
            border: '1px solid rgba(26,26,26,0.10)',
            display: 'flex', flexDirection: 'column', gap: 4,
          }}>
            <span style={{
              fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
              letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)', marginBottom: 2,
            }}>引用来源</span>
            {msg.sources.map((s, i) => (
              <span key={i} style={{ fontSize: 11, color: 'rgba(26,26,26,0.55)', display: 'flex', alignItems: 'center', gap: 6 }}>
                <Icons.FileText size={11} style={{ flexShrink: 0 }} /> {s}
              </span>
            ))}
          </div>
        )}
        <span style={{
          fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
          letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)', display: 'block', marginTop: 8,
        }}>AI · {msg.time}</span>
      </div>
    </div>
  );
}

/* ── Main App ── */

const initMessages = [
  { id: 1, role: 'user', content: '大模型在自然语言处理中的应用有哪些？', time: '09:24' },
  { id: 2, role: 'assistant', content: '大模型在自然语言处理中的应用非常广泛，主要包括：\n\n1. **文本生成** — 如文章写作、摘要生成、对话系统等\n2. **文本理解** — 如情感分析、文本分类、命名实体识别等\n3. **机器翻译** — 提供更自然、准确的翻译结果\n4. **问答系统** — 基于知识库的智能问答\n5. **代码生成** — 根据自然语言描述生成代码\n\n这些应用正在不断发展，推动着 NLP 技术的边界。', time: '09:24', sources: ['ml_notes.pdf — 第3章', 'training.docx — 概述'] },
];

const suggestions = ['大模型训练的关键技术是什么？', '如何评估大模型的性能？'];

function ChatDemo() {
  const [messages, setMessages] = useState(initMessages);
  const [input, setInput] = useState('');
  const [thinking, setThinking] = useState(false);
  const [streaming, setStreaming] = useState(null);
  const scrollRef = useRef(null);

  const scrollToBottom = () => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  };
  useEffect(() => { scrollToBottom(); }, [messages, thinking]);

  const handleSend = () => {
    const text = input.trim();
    if (!text || thinking) return;
    const userMsg = { id: Date.now(), role: 'user', content: text, time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) };
    setMessages(prev => [...prev, userMsg]);
    setInput('');
    setThinking(true);

    setTimeout(() => {
      setThinking(false);
      const aiMsg = {
        id: Date.now() + 1, role: 'assistant',
        content: '感谢你的提问！基于当前知识库中的文档，我为你整理了相关内容。\n\n根据已有资料，这个问题涉及多个层面的技术细节。文档中提到了几个关键的实现方案和最佳实践。\n\n建议你进一步查看引用来源中的原文，以获取更完整的上下文信息。',
        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
        sources: ['RAG 实践笔记.md — 第2节', '大模型技术综述.docx — 第5章'],
      };
      setStreaming(aiMsg.id);
      setMessages(prev => [...prev, aiMsg]);
      setTimeout(() => setStreaming(null), 3500);
    }, 2500 + Math.random() * 1500);
  };

  return (
    <div style={{
      height: '100%', display: 'flex', flexDirection: 'column',
      maxWidth: 800, margin: '0 auto', background: '#FFFFFF',
      borderRadius: 24, border: '1px solid rgba(26,26,26,0.10)',
      overflow: 'hidden', boxShadow: '0 1px 3px rgba(26,26,26,0.06)',
    }}>
      {/* Header */}
      <header style={{
        height: 60, padding: '0 24px', display: 'flex', alignItems: 'center', gap: 14,
        borderBottom: '1px solid rgba(26,26,26,0.06)',
        background: 'rgba(255,255,255,0.80)', backdropFilter: 'blur(12px)', flexShrink: 0,
      }}>
        <div style={{
          width: 32, height: 32, borderRadius: 10,
          background: 'rgba(244,241,237,0.60)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <img src="../../assets/linkrag-mark-v2.png" alt="" style={{ width: 20, height: 20, objectFit: 'contain' }} />
        </div>
        <div>
          <h2 style={{
            fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 15,
            letterSpacing: '-0.03em', color: '#1A1A1A', margin: 0,
          }}>AI 技术问答助手</h2>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
            letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)',
          }}>通用知识库 · 对话演示</span>
        </div>
      </header>

      {/* Messages */}
      <div ref={scrollRef} style={{
        flex: 1, overflowY: 'auto', padding: '24px 32px',
        display: 'flex', flexDirection: 'column', gap: 24,
      }}>
        <div style={{ display: 'flex', justifyContent: 'center' }}>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
            letterSpacing: '0.12em', color: 'rgba(26,26,26,0.40)',
            padding: '6px 16px', border: '1px solid rgba(26,26,26,0.10)', borderRadius: 9999,
          }}>System Initiated · 知识库已绑定</span>
        </div>

        {messages.map(msg => (
          <MessageBubble key={msg.id} msg={msg} isStreaming={streaming === msg.id} />
        ))}

        {thinking && <ThinkingBlock />}

        {!thinking && !streaming && (
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {suggestions.map((s, i) => (
              <button key={i} data-clickable="true" onClick={() => setInput(s)} style={{
                fontSize: 10, fontWeight: 700, textTransform: 'uppercase',
                letterSpacing: '0.1em', padding: '8px 16px',
                border: '1px solid rgba(26,26,26,0.10)', borderRadius: 9999,
                background: 'transparent', color: 'rgba(26,26,26,0.55)',
                cursor: 'pointer', fontFamily: 'var(--font-sans)', transition: 'all 0.2s',
              }}>{s}</button>
            ))}
          </div>
        )}
      </div>

      {/* Composer */}
      <div style={{
        padding: '16px 32px 20px', flexShrink: 0,
        borderTop: '1px solid rgba(26,26,26,0.06)',
        background: 'rgba(244,241,237,0.50)',
      }}>
        <div style={{ position: 'relative' }}>
          <input value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') handleSend(); }}
            placeholder="输入你的问题..."
            style={{
              width: '100%', padding: '16px 60px 16px 20px', borderRadius: 16,
              border: '1px solid rgba(26,26,26,0.10)', fontSize: 13,
              background: '#FFFFFF', color: '#1A1A1A', outline: 'none',
              fontFamily: 'var(--font-sans)',
            }}
          />
          <button onClick={handleSend} disabled={thinking} style={{
            position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)',
            width: 40, height: 40, borderRadius: 12, border: 'none',
            background: thinking ? 'rgba(26,26,26,0.30)' : '#7B6B5D', color: '#fff',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: thinking ? 'not-allowed' : 'pointer',
          }}>
            {thinking
              ? <Icons.Loader2 size={16} className="spin" />
              : <Icons.Send size={16} />
            }
          </button>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8 }}>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
            letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)',
          }}>Engine: Gemini-3-Ultra</span>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
            letterSpacing: '0.1em', color: 'rgba(26,26,26,0.40)',
          }}>按 Enter 发送</span>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChatDemo />);

</script>
</body>
</html>
