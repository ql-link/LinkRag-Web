<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToLink Workspace — UI Kit</title>
<link rel="icon" href="../../assets/favicon-v2.png">
<link rel="stylesheet" href="../../colors_and_type.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  body { font-family: var(--font-sans); font-variant-numeric: lining-nums tabular-nums; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(26,26,26,0.10); border-radius: 99px; }
  .dark-scrollbar::-webkit-scrollbar-thumb { background: #424242; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  a { text-decoration: none; color: inherit; }

  /* Page transition */
  .page-enter { opacity: 0; transform: translateY(6px); }
  .page-active { opacity: 1; transform: translateY(0); transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1); }

  /* Button press feedback */
  button, a[role="button"], [data-clickable] {
    transition: transform 0.12s ease, opacity 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
  }
  button:active, a[role="button"]:active, [data-clickable]:active {
    transform: scale(0.97) !important;
  }

  /* Card hover lift */
  [data-card] {
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, box-shadow 0.3s ease;
  }
  [data-card]:hover {
    transform: translateY(-2px);
  }
  [data-card]:active {
    transform: translateY(0px) scale(0.99);
  }

  /* Dialog entrance */
  @keyframes dialogIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .dialog-backdrop {
    animation: backdropIn 0.2s ease-out forwards;
  }
  .dialog-box {
    animation: dialogIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  /* Nav item transitions */
  [data-nav] {
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  [data-nav]:active {
    transform: scale(0.96);
  }

  /* Active dot pulse */
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  .active-dot {
    animation: dotPulse 2.5s ease-in-out infinite;
  }

  /* Icon hover scale */
  [data-icon-btn] {
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  [data-icon-btn]:hover {
    transform: scale(1.08);
  }
  [data-icon-btn]:active {
    transform: scale(0.92);
  }

  /* Arrow slide-in on card hover */
  @keyframes arrowSlideIn {
    from { opacity: 0; transform: translateX(-4px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Status dot pulse */
  @keyframes statusPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 163, 115, 0.4); }
    50% { box-shadow: 0 0 0 4px rgba(212, 163, 115, 0); }
  }
  .status-pulse {
    animation: statusPulse 2s ease-in-out infinite;
  }

  /* Sidebar collapse animation */
  aside { transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important; }

  /* Smooth scroll areas */
  [style*="overflowY: auto"], [style*="overflow-y: auto"] {
    scroll-behavior: smooth;
  }

  /* Loading spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  /* Toast slide in */
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Thinking Animation (Claude Code style) ── */
  @keyframes thinkingDot {
    0%, 100% { opacity: 0.25; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .thinking-dot {
    animation: thinkingDot 1.2s ease-in-out infinite;
  }

  @keyframes thinkingSweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }
  .thinking-icon-sweep {
    animation: thinkingSweep 1.8s ease-in-out infinite;
  }

  @keyframes thinkingIconRing {
    0%, 100% { border-color: rgba(212,163,115,0.3); }
    50% { border-color: rgba(212,163,115,0.8); }
  }
  .thinking-icon-ring {
    animation: thinkingIconRing 2s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-150%); }
    100% { transform: translateX(250%); }
  }
  .thinking-bar-shimmer {
    animation: shimmer 1.5s ease-in-out infinite;
  }

  /* Stream cursor blink */
  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  .stream-cursor {
    animation: cursorBlink 0.6s ease-in-out infinite;
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="SharedComponents.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="HomeCards.jsx"></script>
<script type="text/babel" src="ChatList.jsx"></script>
<script type="text/babel" src="DatasetGrid.jsx"></script>
<script type="text/babel" src="ChatDetail.jsx"></script>

<script type="text/babel">

/* ── Right Panel ── */
function RightPanel() {
  const t = useT();
  const { dark } = useTheme();
  const [collapsed, setCollapsed] = React.useState(false);

  const activities = [
    { title: '欢迎进入 LinkRag', desc: '前后端联调版工作台' },
    { title: '知识库、文件、对话', desc: '已接入当前可用后端接口' },
    { title: '欢迎页已启用', desc: '退出登录会自动返回入口页' },
  ];

  const stats = [
    { value: 'Auth', label: '欢迎入口' },
    { value: 'Files', label: '文件链路' },
    { value: 'Chats', label: '会话历史' },
    { value: 'Docs', label: '缺口文档' },
  ];

  if (collapsed) {
    return (
      <aside style={{
        width: 60, borderRadius: 24, border: `1px solid ${t.border}`,
        background: dark ? '#2D2D2D' : 'rgba(255,255,255,0.40)',
        backdropFilter: 'blur(12px)', flexShrink: 0,
        display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
        alignItems: 'center', padding: '0 0 14px', transition: 'width 0.3s',
      }}>
        <button onClick={() => setCollapsed(false)} style={{
          width: 36, height: 36, borderRadius: 10, border: 'none',
          background: 'transparent', cursor: 'pointer', color: t.text50,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}><Icons.ChevronLeft size={16} /></button>
      </aside>
    );
  }

  return (
    <aside style={{
      width: 220, borderRadius: 24, border: `1px solid ${t.border}`,
      background: dark ? '#2D2D2D' : 'rgba(255,255,255,0.40)',
      backdropFilter: 'blur(12px)', flexShrink: 0,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      transition: 'width 0.3s',
    }}>
      {/* Activities */}
      <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{
          padding: '18px 18px 8px', flexShrink: 0,
          background: dark ? '#252526' : 'rgba(255,255,255,0.20)',
        }}>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 10, textTransform: 'uppercase',
            letterSpacing: '0.12em', color: t.text50,
          }}>最近活动</span>
        </div>
        <div style={{ flex: 1, padding: '8px 14px', overflowY: 'auto' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {activities.map((item, i) => (
              <div key={i} style={{
                borderRadius: 12, padding: 10,
                background: dark ? '#2D2D2D' : t.card,
                border: `1px solid ${t.border}`,
              }}>
                <p style={{
                  fontSize: 10, fontWeight: 700, textTransform: 'uppercase',
                  letterSpacing: '0.06em', marginBottom: 3,
                  color: dark ? '#E0E0E0' : t.text,
                }}>{item.title}</p>
                <p style={{
                  fontFamily: 'var(--font-mono)', fontSize: 9, textTransform: 'uppercase',
                  letterSpacing: '0.1em', color: t.text50,
                }}>{item.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Stats */}
      <div style={{
        height: '30%', flexShrink: 0, display: 'flex', flexDirection: 'column',
        background: dark ? '#252526' : 'rgba(244,241,237,0.20)',
        borderTop: `1px solid ${t.border}`,
      }}>
        <div style={{ padding: '12px 18px', flexShrink: 0 }}>
          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: 10, textTransform: 'uppercase',
            letterSpacing: '0.12em', color: t.text50,
          }}>工作台状态</span>
        </div>
        <div style={{ flex: 1, padding: '0 14px 10px', overflowY: 'auto' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            {stats.map((s, i) => (
              <div key={i} style={{
                borderRadius: 12, padding: 10, textAlign: 'center',
                background: dark ? '#2D2D2D' : t.card,
                border: `1px solid ${t.border}`,
              }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: dark ? '#E0E0E0' : t.text }}>{s.value}</div>
                <div style={{
                  fontFamily: 'var(--font-mono)', fontSize: 8, textTransform: 'uppercase',
                  letterSpacing: '0.1em', color: t.text50, marginTop: 2,
                }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Collapse */}
      <div style={{ display: 'flex', justifyContent: 'center', padding: '10px 14px' }}>
        <button onClick={() => setCollapsed(true)} style={{
          width: 36, height: 36, borderRadius: 10, border: 'none',
          background: 'transparent', cursor: 'pointer', color: t.text50,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}><Icons.ChevronRight size={16} /></button>
      </div>
    </aside>
  );
}

/* ── Page Router ── */
function PageContent() {
  const { page } = useRoute();
  const [animClass, setAnimClass] = React.useState('page-active');
  const [currentPage, setCurrentPage] = React.useState(page);

  React.useEffect(() => {
    if (page !== currentPage) {
      setAnimClass('page-enter');
      const t = setTimeout(() => {
        setCurrentPage(page);
        setAnimClass('page-active');
      }, 50);
      return () => clearTimeout(t);
    }
  }, [page, currentPage]);

  const renderPage = () => {
    switch (currentPage) {
      case 'home': return <HomePage />;
      case 'datasets': return <DatasetsPage />;
      case 'chats': return <ChatsPage />;
      case 'chat-detail': return <ChatDetailPage />;
      case 'files': return <FilesPage />;
      default: return <PlaceholderPage name={currentPage} />;
    }
  };

  return (
    <main className={animClass} style={{
      flex: 1, minWidth: 0, height: '100%',
      background: 'transparent', borderRadius: 24,
      overflow: 'hidden', display: 'flex', flexDirection: 'column',
    }}>
      <div style={{
        height: '100%', display: 'flex', flexDirection: 'column',
        border: `1px solid ${useT().border}`,
        borderRadius: 24, overflow: 'hidden',
        background: useTheme().dark ? '#1E1E1E' : '#FFFFFF',
      }}>
        {renderPage()}
      </div>
    </main>
  );
}

function PlaceholderPage({ name }) {
  const t = useT();
  const { dark } = useTheme();
  const labels = { llm: 'LLM 配置', usage: '用量' };
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <PageHeader
        title={labels[name] || name}
        breadcrumbs={[{ label: '首页', page: 'home' }, { label: labels[name] || name }]}
      />
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center', gap: 12,
      }}>
        <Icons.Settings size={32} style={{ color: t.text30 }} />
        <p style={{ fontSize: 13, fontWeight: 600, color: dark ? '#E0E0E0' : t.text }}>{labels[name] || name}</p>
        <p style={{ fontSize: 12, color: t.text50 }}>此页面暂未实现</p>
      </div>
    </div>
  );
}

/* ── App Shell ── */
function App() {
  const { dark } = useTheme();
  const t = useT();
  return (
    <div style={{
      height: '100%', display: 'flex', gap: 14, padding: 14,
      background: t.bg, color: t.text,
      fontFamily: 'var(--font-sans)',
    }}>
      <Sidebar />
      <PageContent />
      <RightPanel />
    </div>
  );
}

/* ── Mount ── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <ThemeProvider>
    <RouteProvider>
      <App />
    </RouteProvider>
  </ThemeProvider>
);

</script>
</body>
</html>
