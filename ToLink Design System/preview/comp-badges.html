<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 16px; }
  .label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.40); margin-bottom: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .badge-primary { background: rgba(212,163,115,0.10); color: #D4A373; border: 1px solid rgba(212,163,115,0.20); }
  .badge-neutral { background: rgba(244,241,237,0.70); color: rgba(26,26,26,0.60); border: 1px solid rgba(26,26,26,0.08); }
  .badge-dark { background: #2D2D2D; color: #858585; border: 1px solid #3C3C3C; }
  .badge-blue { background: rgba(59,130,246,0.10); color: #3B82F6; border: 1px solid rgba(59,130,246,0.20); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .mono-tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.50); padding: 6px 14px; border: 1px solid rgba(26,26,26,0.10); border-radius: 9999px; display: inline-block; }
  .parse-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div>
    <div class="label">Dataset Badge</div>
    <div class="row">
      <span class="badge badge-primary"><span style="font-size: 10px;">◆</span> AI 研究库</span>
      <span class="badge badge-primary"><span style="font-size: 10px;">◆</span> 文档总结</span>
      <span class="badge badge-neutral">+2</span>
    </div>
  </div>
  <div>
    <div class="label">Status Badges</div>
    <div class="row">
      <span class="parse-badge" style="background: rgba(34,197,94,0.08); color: #22C55E;">解析完成</span>
      <span class="parse-badge" style="background: rgba(59,130,246,0.08); color: #3B82F6;">解析中</span>
      <span class="parse-badge" style="background: rgba(217,115,115,0.08); color: #D97373;">上传失败</span>
      <span class="parse-badge" style="background: rgba(26,26,26,0.04); color: rgba(26,26,26,0.45);">待解析</span>
    </div>
  </div>
  <div>
    <div class="label">Status Indicators</div>
    <div class="row">
      <span class="badge badge-neutral"><span class="status-dot" style="background: #D4A373;"></span> 已启用</span>
      <span class="badge badge-neutral"><span class="status-dot" style="background: rgba(26,26,26,0.25);"></span> 已停用</span>
      <span class="badge badge-neutral"><span class="status-dot" style="background: #22C55E; animation: pulse 2s infinite;"></span> 在线</span>
    </div>
  </div>
  <div>
    <div class="label">System Tags / Mono Pills</div>
    <div class="row">
      <span class="mono-tag">System Initiated // Node Analysis</span>
      <span class="mono-tag" style="color: #D4A373; border-color: rgba(212,163,115,0.25);">Active Intelligence</span>
    </div>
  </div>
  <style>@keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.4;} }</style>
</body>
</html>
