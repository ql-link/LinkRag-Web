<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 32px; font-family: var(--font-sans); color: #1A1A1A; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(26,26,26,0.06); }
  .row:last-child { border-bottom: none; margin-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(26,26,26,0.40); min-width: 100px; flex-shrink: 0; }
  .sample { flex: 1; }
</style>
</head>
<body>
  <div class="row">
    <span class="meta">Heading XL / 32px</span>
    <span class="sample" style="font-family: var(--font-serif); font-style: italic; font-size: 32px; letter-spacing: -0.03em; line-height: 1.2;">Knowledge Synthesis</span>
  </div>
  <div class="row">
    <span class="meta">Heading LG / 24px</span>
    <span class="sample" style="font-family: var(--font-serif); font-style: italic; font-size: 24px; letter-spacing: -0.03em; line-height: 1.3;">知识检索</span>
  </div>
  <div class="row">
    <span class="meta">Heading MD / 18px</span>
    <span class="sample" style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em;">管理知识库</span>
  </div>
  <div class="row">
    <span class="meta">Heading SM / 14px</span>
    <span class="sample" style="font-size: 14px; font-weight: 700;">上传文档</span>
  </div>
  <div class="row">
    <span class="meta">Body / 14px</span>
    <span class="sample" style="font-size: 14px; line-height: 1.65;">保留原文上下文，为后续检索准备稳定片段。</span>
  </div>
  <div class="row">
    <span class="meta">Caption / 12px</span>
    <span class="sample" style="font-size: 12px; color: rgba(26,26,26,0.55);">导入 PDF、Word、Markdown</span>
  </div>
  <div class="row">
    <span class="meta">Label / 12px bold</span>
    <span class="sample" style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;">知识库名称</span>
  </div>
  <div class="row">
    <span class="meta">Mono / 10px</span>
    <span class="sample" style="font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.50);">System Initiated // Node Analysis</span>
  </div>
</body>
</html>
