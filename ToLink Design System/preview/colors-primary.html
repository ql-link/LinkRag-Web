<!-- @dsCard group="Colors" name="Primary — Warm Amber" subtitle="Accent across active states, tints & hover borders" viewport="680x300" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-mono); }
  .row { display: flex; gap: 12px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 14px 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 80px; }
  .swatch .name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 2px; }
  .swatch .val { font-size: 9px; opacity: 0.7; letter-spacing: 0.05em; }
  .main { background: #D4A373; color: #1A1A1A; }
  .light { background: rgba(212,163,115,0.10); color: #1A1A1A; border: 1px solid rgba(212,163,115,0.25); }
  .mid { background: rgba(212,163,115,0.20); color: #1A1A1A; border: 1px solid rgba(212,163,115,0.30); }
  .hover { background: rgba(212,163,115,0.05); color: #1A1A1A; border: 1px solid rgba(26,26,26,0.08); }
  .accent-bar { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(212,163,115,0.05), #D4A373, rgba(212,163,115,0.20)); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch main">
      <span class="name">Primary</span>
      <span class="val">#D4A373</span>
    </div>
    <div class="swatch mid">
      <span class="name">Primary / 20%</span>
      <span class="val">rgba(212,163,115,0.20)</span>
    </div>
    <div class="swatch light">
      <span class="name">Primary / 10%</span>
      <span class="val">rgba(212,163,115,0.10)</span>
    </div>
    <div class="swatch hover">
      <span class="name">Primary / 5%</span>
      <span class="val">rgba(212,163,115,0.05)</span>
    </div>
  </div>
  <div class="accent-bar"></div>
</body>
</html>
