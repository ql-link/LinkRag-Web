<!-- @dsCard group="Spacing" name="Shadows & Surfaces" subtitle="Minimal elevation, frosted glass" viewport="680x320" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-mono); }
  .section-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.40); margin-bottom: 12px; }
  .shadow-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .shadow-card { flex: 1; background: #fff; border-radius: 16px; padding: 16px 14px; min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; }
  .shadow-card .name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(26,26,26,0.55); margin-bottom: 2px; }
  .shadow-card .val { font-size: 8px; color: rgba(26,26,26,0.35); letter-spacing: 0.04em; }
  .blur-row { display: flex; gap: 14px; }
  .blur-card { flex: 1; padding: 14px 12px; border-radius: 16px; border: 1px solid rgba(26,26,26,0.10); min-height: 56px; display: flex; flex-direction: column; justify-content: flex-end; }
  .blur-card .name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(26,26,26,0.65); margin-bottom: 2px; }
  .blur-card .val { font-size: 8px; color: rgba(26,26,26,0.35); }
</style>
</head>
<body>
  <div class="section-label">Shadow Elevation</div>
  <div class="shadow-row">
    <div class="shadow-card" style="box-shadow: none; border: 1px solid rgba(26,26,26,0.10);">
      <span class="name">None (Default)</span>
      <span class="val">Cards, surfaces</span>
    </div>
    <div class="shadow-card" style="box-shadow: 0 1px 3px rgba(26,26,26,0.06); border: 1px solid rgba(26,26,26,0.10);">
      <span class="name">Card SM</span>
      <span class="val">0 1px 3px 6%</span>
    </div>
    <div class="shadow-card" style="box-shadow: 0 4px 16px rgba(26,26,26,0.10); border: 1px solid rgba(26,26,26,0.10);">
      <span class="name">Card Hover</span>
      <span class="val">0 4px 16px 10%</span>
    </div>
    <div class="shadow-card" style="box-shadow: 0 16px 48px rgba(26,26,26,0.18);">
      <span class="name">Dialog</span>
      <span class="val">0 16px 48px 18%</span>
    </div>
  </div>
  <div class="section-label">Frosted Glass / Backdrop Blur</div>
  <div class="blur-row">
    <div class="blur-card" style="background: rgba(255,255,255,0.80); backdrop-filter: blur(12px);">
      <span class="name">Frosted Panel</span>
      <span class="val">white/80 · blur(12px)</span>
    </div>
    <div class="blur-card" style="background: rgba(255,255,255,0.50); backdrop-filter: blur(8px);">
      <span class="name">Art Card</span>
      <span class="val">white/50 · blur(8px)</span>
    </div>
    <div class="blur-card" style="background: rgba(255,255,255,0.40); backdrop-filter: blur(12px);">
      <span class="name">Right Panel</span>
      <span class="val">white/40 · blur(12px)</span>
    </div>
  </div>
</body>
</html>
