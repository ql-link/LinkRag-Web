<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.40); min-width: 80px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border: none; cursor: pointer; transition: all 0.2s; font-family: var(--font-sans); }
  .btn-primary { background: #7B6B5D; color: #fff; padding: 10px 18px; border-radius: 12px; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-cta-dark { background: #094771; color: #fff; padding: 10px 18px; border-radius: 12px; }
  .btn-ghost { background: transparent; color: rgba(26,26,26,0.70); padding: 10px 18px; border-radius: 12px; }
  .btn-ghost:hover { background: rgba(212,163,115,0.05); }
  .btn-pill { background: transparent; color: #1A1A1A; padding: 8px 16px; border-radius: 9999px; border: 1px solid rgba(26,26,26,0.10); font-size: 10px; letter-spacing: 0.14em; }
  .btn-pill:hover { background: #7B6B5D; color: #fff; }
  .btn-icon { width: 44px; height: 44px; border-radius: 12px; background: #7B6B5D; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; }
  .btn-dashed { background: transparent; color: rgba(26,26,26,0.40); padding: 10px 18px; border-radius: 16px; border: 1px dashed rgba(26,26,26,0.15); font-size: 11px; }
  .btn-dashed:hover { color: #D4A373; border-color: #D4A373; }
  .arrow { font-size: 14px; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">Primary</span>
    <button class="btn btn-primary">创建</button>
    <button class="btn btn-primary" style="padding: 10px 18px; gap: 6px;">
      <span style="font-size: 14px; line-height: 1;">+</span> 新建对话
    </button>
  </div>
  <div class="row">
    <span class="label">Dark CTA</span>
    <button class="btn btn-cta-dark">创建</button>
    <button class="btn btn-cta-dark">保存</button>
  </div>
  <div class="row">
    <span class="label">Ghost</span>
    <button class="btn btn-ghost">取消</button>
    <button class="btn btn-ghost">查看全部</button>
  </div>
  <div class="row">
    <span class="label">Pill</span>
    <button class="btn btn-pill">大模型训练的关键技术是什么？</button>
    <button class="btn btn-pill">如何评估大模型的性能？</button>
  </div>
  <div class="row">
    <span class="label">Icon / Add</span>
    <button class="btn btn-icon"><span style="font-size: 18px; line-height: 1;">→</span></button>
    <button class="btn btn-dashed"><span style="font-size: 16px; margin-right: 4px;">+</span> 添加知识库</button>
  </div>
</body>
</html>
