<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-mono); }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 64px; }
  .swatch .name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
  .swatch .val { font-size: 8px; opacity: 0.65; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#1A1A1A; color:#fff;">
      <span class="name">Text Main</span>
      <span class="val">#1A1A1A</span>
    </div>
    <div class="swatch" style="background:rgba(26,26,26,0.70); color:#fff;">
      <span class="name">Secondary</span>
      <span class="val">70%</span>
    </div>
    <div class="swatch" style="background:rgba(26,26,26,0.50); color:#fff;">
      <span class="name">Tertiary</span>
      <span class="val">50%</span>
    </div>
    <div class="swatch" style="background:rgba(26,26,26,0.40); color:#fff;">
      <span class="name">Muted</span>
      <span class="val">40%</span>
    </div>
    <div class="swatch" style="background:rgba(26,26,26,0.30); color:#fff;">
      <span class="name">Faint</span>
      <span class="val">30%</span>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#F4F1ED; color:#1A1A1A; border:1px solid rgba(26,26,26,0.10);">
      <span class="name">Bg Base</span>
      <span class="val">#F4F1ED</span>
    </div>
    <div class="swatch" style="background:rgba(255,255,255,0.80); color:#1A1A1A; border:1px solid rgba(26,26,26,0.10);">
      <span class="name">Frosted</span>
      <span class="val">white/80</span>
    </div>
    <div class="swatch" style="background:rgba(255,255,255,0.50); color:#1A1A1A; border:1px solid rgba(26,26,26,0.10);">
      <span class="name">Card</span>
      <span class="val">white/50</span>
    </div>
    <div class="swatch" style="background:#FFFFFF; color:#1A1A1A; border:1px solid rgba(26,26,26,0.10);">
      <span class="name">Card Solid</span>
      <span class="val">#FFFFFF</span>
    </div>
    <div class="swatch" style="background:rgba(244,241,237,0.30); color:#1A1A1A; border:1px solid rgba(26,26,26,0.08);">
      <span class="name">Inset</span>
      <span class="val">base/30</span>
    </div>
  </div>
</body>
</html>
