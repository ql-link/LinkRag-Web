<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #1E1E1E; padding: 24px 28px; font-family: var(--font-mono); color: #CCCCCC; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 58px; }
  .swatch .name { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
  .swatch .val { font-size: 8px; opacity: 0.6; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#3B82F6; color:#fff;">
      <span class="name">Primary (Dark)</span>
      <span class="val">#3B82F6</span>
    </div>
    <div class="swatch" style="background:rgba(59,130,246,0.20); color:#93bbfd; border:1px solid rgba(59,130,246,0.3);">
      <span class="name">Primary / 20%</span>
      <span class="val">blue/20</span>
    </div>
    <div class="swatch" style="background:rgba(59,130,246,0.10); color:#93bbfd; border:1px solid rgba(59,130,246,0.2);">
      <span class="name">Primary / 10%</span>
      <span class="val">blue/10</span>
    </div>
    <div class="swatch" style="background:#094771; color:#fff;">
      <span class="name">CTA Button</span>
      <span class="val">#094771</span>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#1E1E1E; color:#ccc; border:1px solid #3c3c3c;">
      <span class="name">Bg Base</span>
      <span class="val">#1E1E1E</span>
    </div>
    <div class="swatch" style="background:#252526; color:#ccc; border:1px solid #3c3c3c;">
      <span class="name">Frosted</span>
      <span class="val">#252526</span>
    </div>
    <div class="swatch" style="background:#2D2D2D; color:#ccc; border:1px solid #3c3c3c;">
      <span class="name">Card</span>
      <span class="val">#2D2D2D</span>
    </div>
    <div class="swatch" style="background:#3C3C3C; color:#ccc;">
      <span class="name">Border</span>
      <span class="val">#3C3C3C</span>
    </div>
    <div class="swatch" style="background:#4A4A4A; color:#ccc;">
      <span class="name">Border Med</span>
      <span class="val">#4A4A4A</span>
    </div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#1E1E1E; border:1px solid #3c3c3c;">
      <span class="name" style="color:#CCCCCC;">Text</span>
      <span class="val" style="color:#CCCCCC;">#CCCCCC</span>
    </div>
    <div class="swatch" style="background:#1E1E1E; border:1px solid #3c3c3c;">
      <span class="name" style="color:#E0E0E0;">Secondary</span>
      <span class="val" style="color:#E0E0E0;">#E0E0E0</span>
    </div>
    <div class="swatch" style="background:#1E1E1E; border:1px solid #3c3c3c;">
      <span class="name" style="color:#858585;">Tertiary</span>
      <span class="val" style="color:#858585;">#858585</span>
    </div>
    <div class="swatch" style="background:#1E1E1E; border:1px solid #3c3c3c;">
      <span class="name" style="color:#6B6B6B;">Muted</span>
      <span class="val" style="color:#6B6B6B;">#6B6B6B</span>
    </div>
  </div>
</body>
</html>
