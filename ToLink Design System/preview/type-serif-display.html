<!-- @dsCard group="Type" name="Serif Display — Playfair" subtitle="Italic headings, tight tracking" viewport="680x320" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 28px 32px; }
  .specimen { margin-bottom: 16px; }
  .specimen .label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(26,26,26,0.45); margin-bottom: 6px; }
  .serif-sample { font-family: var(--font-serif); font-style: italic; letter-spacing: -0.03em; color: #1A1A1A; }
  .cn-wenkai { font-family: "LXGW WenKai", "Noto Serif SC", serif; color: #1A1A1A; }
  .cn-zcool { font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif; color: #1A1A1A; }
  .divider { height: 1px; background: rgba(26,26,26,0.08); margin: 14px 0; }
  .pair-row { display: flex; gap: 20px; align-items: baseline; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="label">Playfair Display — Serif Display / Headings</div>
    <div class="serif-sample" style="font-size: 32px; line-height: 1.15;">Knowledge Synthesis</div>
  </div>
  <div class="specimen">
    <div class="label">Playfair Display — Weights</div>
    <div style="display: flex; gap: 24px; align-items: baseline;">
      <span class="serif-sample" style="font-size: 20px; font-weight: 400;">Regular</span>
      <span class="serif-sample" style="font-size: 20px; font-weight: 500;">Medium</span>
      <span class="serif-sample" style="font-size: 20px; font-weight: 600;">SemiBold</span>
      <span class="serif-sample" style="font-size: 20px; font-weight: 700;">Bold</span>
    </div>
  </div>
  <div class="divider"></div>
  <div class="specimen">
    <div class="label">LXGW WenKai — Chinese Display (Recommended)</div>
    <div class="cn-wenkai" style="font-size: 28px; line-height: 1.35;">知识检索与智能合成</div>
  </div>
  <div class="specimen">
    <div class="label">Chinese + English Pairing</div>
    <div class="pair-row">
      <span class="cn-wenkai" style="font-size: 24px; line-height: 1.3;">文档分块</span>
      <span class="serif-sample" style="font-size: 24px;">Knowledge Synthesis</span>
    </div>
  </div>
  <div class="specimen">
    <div class="label">Mixed Heading — Greeting Pattern</div>
    <div style="font-size: 22px; line-height: 1.3; color: #1A1A1A;">
      <span style="font-family: 'LXGW WenKai', sans-serif;">下午好，</span><span class="serif-sample" style="font-size: 22px;">Alex Chen</span>
    </div>
  </div>
</body>
</html>
