<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #F4F1ED; padding: 24px 28px; font-family: var(--font-mono); }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 10px; padding: 14px 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 80px; }
  .swatch .name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px; }
  .swatch .val { font-size: 9px; opacity: 0.7; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#D97373; color:#fff;">
      <span class="name">Error</span>
      <span class="val">#D97373</span>
    </div>
    <div class="swatch" style="background:#22C55E; color:#fff;">
      <span class="name">Success</span>
      <span class="val">#22C55E</span>
    </div>
    <div class="swatch" style="background:#3B82F6; color:#fff;">
      <span class="name">Info</span>
      <span class="val">#3B82F6</span>
    </div>
    <div class="swatch" style="background:#F59E0B; color:#fff;">
      <span class="name">Warning</span>
      <span class="val">#F59E0B</span>
    </div>
  </div>
</body>
</html>
