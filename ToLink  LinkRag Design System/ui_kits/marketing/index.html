<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkRag — 读懂你的每一份文档</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--canvas); font-family: var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  a:hover { color: var(--primary) !important; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="SectionsTop.jsx"></script>
<script type="text/babel" src="SectionsBottom.jsx"></script>
<script type="text/babel" data-presets="react">
  function Page() {
    return (
      <React.Fragment>
        <window.MK_TopNav />
        <window.MK_Hero />
        <window.MK_LogoStrip />
        <window.MK_Features />
        <window.MK_DarkBand />
        <window.MK_Pricing />
        <window.MK_CTABand />
        <window.MK_Footer />
      </React.Fragment>
    );
  }
  function mount() {
    if (!window.MK_TopNav || !window.MK_Footer) { setTimeout(mount, 40); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
  }
  mount();
</script>
</body>
</html>
