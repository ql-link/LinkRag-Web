<!-- @dsCard group="Colors" name="Primary — Anthropic Coral" subtitle="Accent only: button fills, inline links, thin rules, marks — never a large fill" viewport="680x300" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #faf9f5; padding: 24px 28px; font-family: var(--font-mono); }
  .row { display: flex; gap: 12px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 14px 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 84px; }
  .swatch .name { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 3px; }
  .swatch .val { font-size: 10px; opacity: 0.75; letter-spacing: 0.02em; }
  .main { background: #cc785c; color: #fff; }
  .active { background: #a9583e; color: #fff; }
  .light { background: rgba(204,120,92,0.12); color: #141413; border: 1px solid rgba(204,120,92,0.28); }
  .disabled { background: #e6dfd8; color: #6c6a64; border: 1px solid rgba(20,20,19,0.08); }
  .accent-bar { height: 6px; border-radius: 3px; background: #cc785c; margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch main"><span class="name">Primary / Coral</span><span class="val">#cc785c</span></div>
    <div class="swatch active"><span class="name">Active</span><span class="val">#a9583e</span></div>
    <div class="swatch light"><span class="name">Tint / 12%</span><span class="val">rgba(204,120,92,.12)</span></div>
    <div class="swatch disabled"><span class="name">Disabled</span><span class="val">#e6dfd8</span></div>
  </div>
  <div class="accent-bar"></div>
</body>
</html>
