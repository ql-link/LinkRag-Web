<!-- @dsCard group="Colors" name="Surfaces — Cream Trinity & Dark" subtitle="Canvas, cards, dark-navy product chrome" viewport="680x240" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #faf9f5; padding: 24px 28px; font-family: var(--font-mono); }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 70px; }
  .swatch .name { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 2px; }
  .swatch .val { font-size: 9px; opacity: 0.7; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background:#faf9f5; color:#141413; border:1px solid #e6dfd8;"><span class="name">Canvas</span><span class="val">#faf9f5</span></div>
    <div class="swatch" style="background:#f5f0e8; color:#141413; border:1px solid #e6dfd8;"><span class="name">Surface Soft</span><span class="val">#f5f0e8</span></div>
    <div class="swatch" style="background:#efe9de; color:#141413; border:1px solid #e6dfd8;"><span class="name">Surface Card</span><span class="val">#efe9de</span></div>
    <div class="swatch" style="background:#e8e0d2; color:#141413; border:1px solid #e6dfd8;"><span class="name">Cream Strong</span><span class="val">#e8e0d2</span></div>
  </div>
  <div class="row">
    <div class="swatch" style="background:#181715; color:#faf9f5;"><span class="name">Surface Dark</span><span class="val">#181715</span></div>
    <div class="swatch" style="background:#1f1e1b; color:#faf9f5;"><span class="name">Dark Soft</span><span class="val">#1f1e1b</span></div>
    <div class="swatch" style="background:#252320; color:#faf9f5;"><span class="name">Dark Elevated</span><span class="val">#252320</span></div>
    <div class="swatch" style="background:#faf9f5; color:#141413; border:1px solid #e6dfd8;"><span class="name">Hairline</span><span class="val">#e6dfd8</span></div>
  </div>
</body>
</html>
