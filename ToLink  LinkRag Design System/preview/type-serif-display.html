<!-- @dsCard group="Type" name="Serif Display — Cormorant" subtitle="Copernicus substitute · upright 500 · negative tracking" viewport="680x320" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #faf9f5; padding: 28px 32px; }
  .specimen { margin-bottom: 18px; }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; color: #8e8b82; margin-bottom: 6px; }
  .serif { font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.02em; color: #141413; }
  .divider { height: 1px; background: #ebe6df; margin: 16px 0; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="label">Display XL — 64 / 500 / -0.022em</div>
    <div class="serif" style="font-size: 56px; line-height: 1.05;">Meet your thinking partner</div>
  </div>
  <div class="divider"></div>
  <div class="specimen">
    <div class="label">Weights — regular vs. medium (display stays ≤ 500)</div>
    <div style="display: flex; gap: 28px; align-items: baseline;">
      <span class="serif" style="font-size: 30px; font-weight: 400;">Regular</span>
      <span class="serif" style="font-size: 30px; font-weight: 500;">Medium</span>
      <span class="serif" style="font-size: 30px; font-weight: 600;">SemiBold</span>
    </div>
  </div>
  <div class="specimen">
    <div class="label">Note · substitutes Copernicus / Tiempos Headline</div>
    <div class="serif" style="font-size: 22px; color:#3d3d3a;">The serif character is the brand voice</div>
  </div>
</body>
</html>
