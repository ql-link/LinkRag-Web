server {
    listen       80;
    server_name  linkrag.cn www.linkrag.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    client_max_body_size 25m;
    listen       443 ssl;
    http2 on;
    server_name  linkrag.cn www.linkrag.cn;

    ssl_certificate     /etc/letsencrypt/live/linkrag.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkrag.cn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    root   /usr/share/nginx/html;
    index  index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # 后端 API 反向代理到 Java 管理端（toLink-Service）
    # 部署时 tolink-service 解析为同主机容器或内网地址，按需修改
    location = /api/v1/rag/stream {
        proxy_pass         http://117.72.214.40:8000;
        proxy_set_header   Host              117.72.214.40:8000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass         http://tolink-service:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_set_header   Accept-Encoding   "";
        sub_filter_types   application/json;
        sub_filter_once    off;
        sub_filter         "http://103.205.254.30:39000/tolink-public/" "/tolink-public/";
        sub_filter         "http://100.86.10.52:9000/tolink-public/" "/tolink-public/";
        sub_filter         "http://117.72.214.40:8000/api/v1/rag/stream" "/api/v1/rag/stream";
    }

    # 公共 OSS 文件代理，避免 HTTPS 页面加载 HTTP 图片被浏览器拦截
    location ^~ /tolink-public/ {
        proxy_pass         http://100.86.10.52:9000;
        proxy_set_header   Host              100.86.10.52:9000;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
