<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44" fill="none"><style>.ink,.cor{stroke-dasharray:34 66}.ink{animation:flow 1.3s linear infinite,bA 1.3s ease-in-out infinite}.cor{animation:flow 1.3s linear infinite,bB 1.3s ease-in-out infinite;animation-delay:-.65s,0s}.sig{transform-box:fill-box;transform-origin:center;animation:sh 1.3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes bA{0%,100%{opacity:.5}30%{opacity:1}}@keyframes bB{0%,100%{opacity:1}30%{opacity:.55}}@keyframes sh{0%,50%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}78%{transform:translateX(6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;stroke-dasharray:none!important}}</style><g class="grp"><rect class="ink" x="4.5" y="15" width="22" height="14" rx="7" pathLength="100" fill="none" stroke="#f1ede6" stroke-width="3.4" stroke-linecap="round"/><rect class="cor" x="17.5" y="15" width="22" height="14" rx="7" pathLength="100" fill="none" stroke="#d98a70" stroke-width="3.4" stroke-linecap="round"/></g><circle class="sig" cx="22" cy="22" r="3" fill="#d98a70"/></svg>
