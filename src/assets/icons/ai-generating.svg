<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
<style>
.edge{stroke-dasharray:18 10;animation:aiEdgeFlow 1.7s linear infinite}
.node{transform-box:fill-box;transform-origin:center;animation:aiNodePulse 1.8s ease-in-out infinite}
.n-b{animation-delay:.18s}.n-c{animation-delay:.36s}
.spk{transform-box:fill-box;transform-origin:center;animation:aiSparkPulse 1.35s ease-in-out infinite}
.spk-s1{animation-delay:.18s}.spk-s2{animation-delay:.34s}
@keyframes aiEdgeFlow{to{stroke-dashoffset:-28}}
@keyframes aiNodePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.16);opacity:.82}}
@keyframes aiSparkPulse{0%,100%{transform:scale(.86);opacity:.45}45%{transform:scale(1.18);opacity:1}}
@media (prefers-reduced-motion:reduce){.edge,.node,.spk{animation:none}}
</style>

<g class="scope">
