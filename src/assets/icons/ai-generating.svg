<g stroke="#2f3743" stroke-width="2.8" stroke-linecap="round">
<line class="edge" x1="20" y1="25" x2="32" y2="21"></line>
<line class="edge" x1="32" y1="21" x2="29" y2="34"></line>
<line class="edge" x1="29" y1="34" x2="20" y2="25"></line>
</g>
<g transform="translate(20,25)"><circle class="node n-a" r="4.3" fill="#ffffff" stroke="#4e8b81" stroke-width="2.8"></circle></g>
<g transform="translate(32,21)"><circle class="node n-b" r="4.3" fill="#ffffff" stroke="#e8964a" stroke-width="2.8"></circle></g>
<g transform="translate(29,34)"><circle class="node n-c" r="4.3" fill="#ffffff" stroke="#e8964a" stroke-width="2.8"></circle></g>
<g transform="translate(50,34)"><path class="spk spk-lg" fill="#e8964a" d="M0,-7 C0.84,-2.45 2.45,-0.84 7,0 C2.45,0.84 0.84,2.45 0,7 C-0.84,2.45 -2.45,0.84 -7,0 C-2.45,-0.84 -0.84,-2.45 0,-7 z"></path></g>
<g transform="translate(45,25)"><path class="spk spk-s1" fill="#4e8b81" d="M0,-4 C0.48,-1.4 1.4,-0.48 4,0 C1.4,0.48 0.48,1.4 0,4 C-0.48,1.4 -1.4,0.48 -4,0 C-1.4,-0.48 -0.48,-1.4 0,-4 z"></path></g>
<g transform="translate(46,43)"><path class="spk spk-s2" fill="#4e8b81" d="M0,-3.4 C0.41,-1.2 1.2,-0.41 3.4,0 C1.2,0.41 0.41,1.2 0,3.4 C-0.41,1.2 -1.2,0.41 -3.4,0 C-1.2,-0.41 -0.41,-1.2 0,-3.4 z"></path></g>
</g>
</svg>
